name: Python Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/**"
      - "utils/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  test:
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jobs_tracker_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -p 5433:5432

    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/jobs_tracker_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Initialise test database
        run: psql "$DATABASE_URL" -f database/schema.sql

      - name: Run tests
        run: uv run pytest tests/ -v
