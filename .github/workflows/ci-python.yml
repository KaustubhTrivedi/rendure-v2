name: Python Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/**"
      - "utils/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  test:
    runs-on: self-hosted

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/jobs_tracker_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up test database
        run: |
          sudo -u postgres psql -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'test') THEN CREATE ROLE test WITH LOGIN PASSWORD 'test'; END IF; END \$\$;"
          sudo -u postgres psql -c "DROP DATABASE IF EXISTS jobs_tracker_test;"
          sudo -u postgres psql -c "CREATE DATABASE jobs_tracker_test OWNER test;"

      - name: Initialise schema
        run: psql "$DATABASE_URL" -f db/schema.sql

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v
