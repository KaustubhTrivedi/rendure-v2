server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip the text assets we serve
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # Single static page — anything not found falls back to it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache the HTML lightly so updates show up quickly.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
