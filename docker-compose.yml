services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rendure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rendurepw@123}
      POSTGRES_DB: ${POSTGRES_DB:-rendure_db}
    volumes:
      - rendure_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-rendure_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-rendurepw@123}
      PGDATABASE: ${POSTGRES_DB:-rendure_db}
    volumes:
      - ./database:/migrations:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://rendure_user:rendurepw%40123@db:5432/rendure_db}
      RENDURE_API_KEY: ${RENDURE_API_KEY:-this_is_the_api_key}
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:-91CC3417D21B4CECB294E2D5413D3FD6A211EA095D468111F25FCDFDB4A92C29}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-8b}
      MODEL_JOB_SCOUT: ${MODEL_JOB_SCOUT:-}
      MODEL_RESUME_TAILOR: ${MODEL_RESUME_TAILOR:-}
      MODEL_QUALITY_ANALYST: ${MODEL_QUALITY_ANALYST:-}
      MODEL_CONFIRMATION: ${MODEL_CONFIRMATION:-}
      MODEL_ORCHESTRATOR: ${MODEL_ORCHESTRATOR:-}
      MODEL_FALLBACK: ${MODEL_FALLBACK:-}
      QA_PASS_THRESHOLD: ${QA_PASS_THRESHOLD:-0.92}
      MAX_TAILORING_ITERATIONS: ${MAX_TAILORING_ITERATIONS:-4}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-300}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-5}
      JINA_API_KEY: ${JINA_API_KEY:-}
      RESUME_PDF_CACHE_DIR: /var/cache/rendure/resumes
    volumes:
      - resume_pdf_cache:/var/cache/rendure/resumes
      - ${HOME}/.codex:/root/.codex
    expose:
      - "3002"
      - "1455"
    ports:
      - "3002:3002"
      - "1455:1455"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_API_KEY: ${RENDURE_API_KEY:-this_is_the_api_key}
    environment:
      RENDURE_API_KEY: ${RENDURE_API_KEY:-this_is_the_api_key}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

  agents:
    build:
      context: .
      dockerfile: Dockerfile.agents
    profiles:
      - agents
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://rendure_user:rendurepw%40123@db:5432/rendure_db}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-8b}
      MODEL_JOB_SCOUT: ${MODEL_JOB_SCOUT:-}
      MODEL_RESUME_TAILOR: ${MODEL_RESUME_TAILOR:-}
      MODEL_QUALITY_ANALYST: ${MODEL_QUALITY_ANALYST:-}
      MODEL_CONFIRMATION: ${MODEL_CONFIRMATION:-}
      MODEL_ORCHESTRATOR: ${MODEL_ORCHESTRATOR:-}
      MODEL_FALLBACK: ${MODEL_FALLBACK:-}
      QA_PASS_THRESHOLD: ${QA_PASS_THRESHOLD:-0.92}
      MAX_TAILORING_ITERATIONS: ${MAX_TAILORING_ITERATIONS:-4}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-300}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-5}
      JINA_API_KEY: ${JINA_API_KEY:-}
    volumes:
      - ./resume:/app/resume

volumes:
  rendure_db_data:
  resume_pdf_cache:
