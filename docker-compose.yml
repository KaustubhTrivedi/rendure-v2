services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rendure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rendure}
    volumes:
      - rendure_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-rendure}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-rendure}
    volumes:
      - ./database:/migrations:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rendure}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-rendure}
      RENDURE_API_KEY: ${RENDURE_API_KEY:?RENDURE_API_KEY is required}
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:?PROFILE_ENCRYPTION_KEY is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-8b}
      MODEL_JOB_SCOUT: ${MODEL_JOB_SCOUT:-}
      MODEL_RESUME_TAILOR: ${MODEL_RESUME_TAILOR:-}
      MODEL_QUALITY_ANALYST: ${MODEL_QUALITY_ANALYST:-}
      MODEL_CONFIRMATION: ${MODEL_CONFIRMATION:-}
      MODEL_ORCHESTRATOR: ${MODEL_ORCHESTRATOR:-}
      MODEL_FALLBACK: ${MODEL_FALLBACK:-}
      QA_PASS_THRESHOLD: ${QA_PASS_THRESHOLD:-0.92}
      MAX_TAILORING_ITERATIONS: ${MAX_TAILORING_ITERATIONS:-4}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-300}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-5}
      JINA_API_KEY: ${JINA_API_KEY:-}
      RESUME_PDF_CACHE_DIR: /var/cache/rendure/resumes
    volumes:
      - resume_pdf_cache:/var/cache/rendure/resumes
    expose:
      - "3002"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_API_KEY: ${RENDURE_API_KEY:?RENDURE_API_KEY is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

  agents:
    build:
      context: .
      dockerfile: Dockerfile.agents
    profiles:
      - agents
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rendure}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-rendure}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-8b}
      MODEL_JOB_SCOUT: ${MODEL_JOB_SCOUT:-}
      MODEL_RESUME_TAILOR: ${MODEL_RESUME_TAILOR:-}
      MODEL_QUALITY_ANALYST: ${MODEL_QUALITY_ANALYST:-}
      MODEL_CONFIRMATION: ${MODEL_CONFIRMATION:-}
      MODEL_ORCHESTRATOR: ${MODEL_ORCHESTRATOR:-}
      MODEL_FALLBACK: ${MODEL_FALLBACK:-}
      QA_PASS_THRESHOLD: ${QA_PASS_THRESHOLD:-0.92}
      MAX_TAILORING_ITERATIONS: ${MAX_TAILORING_ITERATIONS:-4}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-300}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-5}
      JINA_API_KEY: ${JINA_API_KEY:-}
    volumes:
      - ./resume:/app/resume

volumes:
  rendure_db_data:
  resume_pdf_cache:
