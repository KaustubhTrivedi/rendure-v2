# Hosts ONLY the Rendure landing page — nothing else.
# No API, no agents, no Postgres. Just the static marketing page on nginx.
#
#   docker compose -f docker-compose.landing.yml up -d --build
# Then configure the Dokploy domain to route to service "landing" on port 80.

services:
  landing:
    build: ./landing
    image: rendure-landing
    expose:
      - "80"
    restart: unless-stopped
