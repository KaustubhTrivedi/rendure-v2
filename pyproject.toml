[project]
name = "jobs-tracker"
version = "0.1.0"
description = "Automated resume tailoring pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "langchain>=1.2.10",
    "langchain-core>=1.2.16",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "httpx>=0.27.0",
    "openrouter>=0.1.0",
    "tenacity==8.2.3",
    "pytest>=8.3.0",
    "cryptography>=48.0.0",
    "rendercv[full]>=2.8",
    "scrapling[fetchers]>=0.4.8",
    "apscheduler>=3.10",
    "feedparser>=6.0.12",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
# Only collect the unit test suite. This keeps root-level smoke scripts like
# first_test.py (which performs a live OpenRouter call at import) out of normal
# pytest runs.
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["agents/**", "utils/**"]
